name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install release tooling and test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY
      - name: Run release checks
        run: |
          python scripts/sync_reference_data.py --check
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
