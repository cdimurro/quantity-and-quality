services:
  - type: web
    name: exergy-factor-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./deploy/huggingface-space/Dockerfile
    dockerContext: ./deploy/huggingface-space
    domains:
      - api.exergyfactor.com
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: QQ_API_REQUIRE_KEY
        value: "0"
      - key: QQ_API_CORS_ORIGINS
        value: https://exergyfactor.com,https://www.exergyfactor.com
      - key: QQ_MCP_HTTP_ENABLED
        value: "1"
