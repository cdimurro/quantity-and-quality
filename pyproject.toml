[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantity-and-quality"
version = "0.13.0"
description = "Calculate stream quantity, Exergy Factor, accessible exergy, and Applied Exergy at end use."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher DiMurro", email = "chrisdimurro@gmail.com" }
]
keywords = ["energy", "exergy", "thermodynamics", "energy reporting", "measurement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/cdimurro/quantity-and-quality"
Repository = "https://github.com/cdimurro/quantity-and-quality"
Changelog = "https://github.com/cdimurro/quantity-and-quality/blob/main/CHANGELOG.md"
Paper = "https://github.com/cdimurro/quantity-and-quality/blob/main/paper/quantity-and-quality-standard-reporting-framework.pdf"

[project.optional-dependencies]
data = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0"]
scenario = ["PyYAML>=6.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
paper = ["pandas>=2.0", "matplotlib>=3.8", "numpy>=1.26"]
fluids = ["CoolProp>=8.0,<9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build>=1.2", "twine>=5.0", "ruff>=0.12", "jsonschema>=4.23", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
all = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0", "PyYAML>=6.0", "fastapi>=0.115", "uvicorn[standard]>=0.30", "CoolProp>=8.0,<9"]

[project.scripts]
quantity-quality = "quantity_quality.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantity_quality = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["quantity_quality"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
